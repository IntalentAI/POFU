# Test every push and pull request; deploy `main` to Cloud Run.
# One-time Google Cloud setup: deploy/setup-gcp.sh (prints the repository variables this workflow needs).
name: Test & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'pofu' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  deploy:
    needs: test
    # Skipped until deploy/setup-gcp.sh has been run and the repository variables are set.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Workload Identity Federation — no long-lived keys
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$SERVICE/$SERVICE:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        env:
          SEED_DEMO: ${{ vars.SEED_DEMO || 'false' }}
          APP_URL_VAR: ${{ vars.APP_URL }}
          EXTRA_ENV_VARS: ${{ vars.EXTRA_ENV_VARS }}
          EXTRA_SECRETS: ${{ vars.EXTRA_SECRETS }}
        run: |
          # Keep the public URL stable across deploys (first deploy learns it afterwards).
          APP_URL="${APP_URL_VAR:-$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)' 2>/dev/null || true)}"
          ENV_VARS="LITESTREAM_REPLICA_URL=gcs://${{ vars.LITESTREAM_BUCKET }}/app.db,ENABLE_INTERNAL_SCHEDULER=false,SEED_DEMO=$SEED_DEMO"
          [ -n "$APP_URL" ] && ENV_VARS="$ENV_VARS,APP_URL=$APP_URL"
          [ -n "$EXTRA_ENV_VARS" ] && ENV_VARS="$ENV_VARS,$EXTRA_ENV_VARS"
          SECRETS="AUTH_SECRET=$SERVICE-auth-secret:latest,CRON_SECRET=$SERVICE-cron-secret:latest"
          [ -n "$EXTRA_SECRETS" ] && SECRETS="$SECRETS,$EXTRA_SECRETS"

          # SQLite + Litestream requires exactly one always-on instance with CPU outside requests.
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --allow-unauthenticated \
            --port 8080 \
            --execution-environment gen2 \
            --cpu 1 --memory 1Gi \
            --min-instances 1 --max-instances 1 \
            --no-cpu-throttling \
            --set-env-vars "$ENV_VARS" \
            --set-secrets "$SECRETS"

          URL="$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')"
          if [ -z "$APP_URL" ]; then
            gcloud run services update "$SERVICE" --region "$REGION" --update-env-vars "APP_URL=$URL"
          fi
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "### Deployed to $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Schedule engagement runs (Cloud Scheduler)
        run: |
          CRON_SECRET="$(gcloud secrets versions access latest --secret "$SERVICE-cron-secret")"
          echo "::add-mask::$CRON_SECRET"
          upsert() { # name, schedule, path
            if gcloud scheduler jobs describe "$1" --location "$REGION" >/dev/null 2>&1; then
              op=update; headers=--update-headers
            else
              op=create; headers=--headers
            fi
            gcloud scheduler jobs "$op" http "$1" --location "$REGION" --schedule "$2" \
              --uri "$URL$3" --http-method POST \
              "$headers" "Authorization=Bearer $CRON_SECRET" --attempt-deadline 300s --quiet
          }
          upsert "$SERVICE-tick" "*/5 * * * *" "/api/cron/tick"
          upsert "$SERVICE-readiness-sweep" "7 * * * *" "/api/cron/tick?sweep=1"

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "$URL/api/health" && exit 0
            sleep 10
          done
          exit 1
